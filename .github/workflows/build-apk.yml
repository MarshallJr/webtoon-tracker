name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk WebtoonTracker.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WebtoonTracker-apk
          path: WebtoonTracker.apk

      - name: Publish release (téléchargement facile depuis le téléphone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Webtoon Tracker (build ${{ github.run_number }})
          body: APK généré automatiquement. Télécharge WebtoonTracker.apk ci-dessous et installe-le.
          files: WebtoonTracker.apk
          make_latest: true
