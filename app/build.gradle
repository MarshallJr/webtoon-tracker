plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lois.webtoontracker'
    compileSdk 35

    defaultConfig {
        applicationId 'com.lois.webtoontracker'
        minSdk 26
        targetSdk 35
        versionCode 12
        versionName '2.5'
    }

    // Clé de signature FIXE : sans elle, chaque build GitHub avait une clé différente
    // et Android refusait la mise à jour (obligé de désinstaller = perte des données).
    signingConfigs {
        shared {
            storeFile file('signing/webtoontracker.jks')
            storePassword 'wtTracker2026'
            keyAlias 'webtoontracker'
            keyPassword 'wtTracker2026'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.shared
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.work:work-runtime:2.9.1'
}
